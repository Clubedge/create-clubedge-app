# Dependency updates for the CLI: minor and patch npm updates as one weekly pull request, majors one
# by one, and GitHub Actions updates grouped. CI, which generates and tests real projects, is the gate.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
