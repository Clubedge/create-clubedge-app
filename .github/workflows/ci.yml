name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  # Windows runs commands through cmd.exe and has drive roots and CRLF checkouts, which have
  # broken the CLI before; these jobs keep it working there.
  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  generated-project-windows:
    name: generated-project-windows (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: next-default, framework: next, modules: "", change: add cache memory, final: --cache memory }
          - {
              name: start-local,
              framework: tanstack-start,
              modules: --infra local --auth better-auth,
              change: remove storage,
              final: --infra local --auth better-auth --storage none,
            }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Build, bundle, and pack the CLI
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build
          pnpm bundle-template
          temp="$(cygpath -u "$RUNNER_TEMP")"
          npm pack --pack-destination "$temp"
          mkdir -p "$temp/packed-cli"
          tar -xzf "$temp"/clubedge-create-clubedge-app-*.tgz -C "$temp/packed-cli"
          npm install --prefix "$temp/packed-cli/package" --omit=dev --ignore-scripts
          echo "CLI=$temp/packed-cli/package/bin/create.mjs" >> "$GITHUB_ENV"
          echo "TEMP_DIR=$temp" >> "$GITHUB_ENV"
      - name: Generate a project
        run: |
          set -euo pipefail
          node "$CLI" "$TEMP_DIR/changed/my-app" --framework ${{ matrix.framework }} ${{ matrix.modules }} --no-install --yes
          cd "$TEMP_DIR/changed/my-app"
          git config user.email ci@example.com
          git config user.name CI
          git add -A
          git commit -qm "Generated project"
          echo "Notes of our own." >> README.md
          git commit -qam "Our change"
      - name: Change a module and match a project generated with that selection
        run: |
          set -euo pipefail
          cd "$TEMP_DIR/changed/my-app"
          node "$CLI" ${{ matrix.change }} --no-install --yes
          node "$CLI" "$TEMP_DIR/fresh/my-app" --framework ${{ matrix.framework }} ${{ matrix.final }} --no-install --no-git --yes
          diff -r -x .git "$TEMP_DIR/changed/my-app" "$TEMP_DIR/fresh/my-app" > "$TEMP_DIR/diff.txt" || true
          cat "$TEMP_DIR/diff.txt"
          # Our README line is the only difference.
          test "$(grep -c '^[<>]' "$TEMP_DIR/diff.txt")" = 1
          grep -qx '< Notes of our own.' "$TEMP_DIR/diff.txt"
      - name: Install, lint, typecheck, test, and build the changed project
        working-directory: ${{ runner.temp }}/changed/my-app
        run: |
          pnpm install --frozen-lockfile
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

  # add and remove on a project with an edit of its own: after several changes, the project must
  # match one generated with the final selection, apart from that edit, and still build.
  change-modules:
    name: change-modules (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [next, tanstack-start]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Build, bundle, and pack the CLI
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build
          pnpm bundle-template
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/packed-cli"
          tar -xzf "$RUNNER_TEMP"/clubedge-create-clubedge-app-*.tgz -C "$RUNNER_TEMP/packed-cli"
          npm install --prefix "$RUNNER_TEMP/packed-cli/package" --omit=dev --ignore-scripts
          echo "CLI=$RUNNER_TEMP/packed-cli/package/bin/create.mjs" >> "$GITHUB_ENV"
      - name: Generate a project and change it
        shell: bash
        run: |
          set -euo pipefail
          node "$CLI" "$RUNNER_TEMP/changed/my-app" --framework ${{ matrix.framework }} --no-install --yes
          cd "$RUNNER_TEMP/changed/my-app"
          git config user.email ci@example.com
          git config user.name CI
          git add -A
          git commit -qm "Generated project"
          echo "Notes of our own." >> README.md
          git commit -qam "Our change"
      - name: Change modules one at a time
        working-directory: ${{ runner.temp }}/changed/my-app
        shell: bash
        run: |
          set -euo pipefail
          for change in "add auth better-auth" "remove storage" "add cache memory" "add infra local"; do
            echo "::group::$change"
            node "$CLI" $change --no-install --yes
            git add -A
            git commit -qm "$change"
            echo "::endgroup::"
          done
      - name: Match a project generated with the final selection
        shell: bash
        run: |
          set -euo pipefail
          node "$CLI" "$RUNNER_TEMP/fresh/my-app" --framework ${{ matrix.framework }} \
            --auth better-auth --storage none --cache memory --infra local --no-install --no-git --yes
          diff -r -x .git -x node_modules "$RUNNER_TEMP/changed/my-app" "$RUNNER_TEMP/fresh/my-app" > "$RUNNER_TEMP/diff.txt" || true
          cat "$RUNNER_TEMP/diff.txt"
          # Our README line is the only difference.
          test "$(grep -c '^[<>]' "$RUNNER_TEMP/diff.txt")" = 1
          grep -qx '< Notes of our own.' "$RUNNER_TEMP/diff.txt"
      - name: Install, lint, typecheck, test, and build the changed project
        working-directory: ${{ runner.temp }}/changed/my-app
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

  # upgrade from an earlier Starter release to the pinned one on a project with an edit of its
  # own: the result must match a project generated from the pinned release, apart from that edit.
  upgrade-project:
    name: upgrade-project (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: next-from-v0.6.0, framework: next, from: v0.6.0, modules: "", final: "" }
          # v0.5.0 predates the infra module, so the upgrade adds it as none.
          - {
              name: start-from-v0.5.0,
              framework: tanstack-start,
              from: v0.5.0,
              modules: --auth better-auth,
              final: --auth better-auth --infra none,
            }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Build, bundle, and pack the CLI
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build
          pnpm bundle-template
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/packed-cli"
          tar -xzf "$RUNNER_TEMP"/clubedge-create-clubedge-app-*.tgz -C "$RUNNER_TEMP/packed-cli"
          npm install --prefix "$RUNNER_TEMP/packed-cli/package" --omit=dev --ignore-scripts
          echo "CLI=$RUNNER_TEMP/packed-cli/package/bin/create.mjs" >> "$GITHUB_ENV"
      - name: Generate a project from ${{ matrix.from }} and change it
        shell: bash
        run: |
          set -euo pipefail
          node "$CLI" "$RUNNER_TEMP/upgraded/my-app" --ref ${{ matrix.from }} --framework ${{ matrix.framework }} ${{ matrix.modules }} --no-install --yes
          cd "$RUNNER_TEMP/upgraded/my-app"
          git config user.email ci@example.com
          git config user.name CI
          git add -A
          git commit -qm "Generated project"
          echo "Notes of our own." >> README.md
          git commit -qam "Our change"
      - name: Upgrade to the pinned Starter
        working-directory: ${{ runner.temp }}/upgraded/my-app
        run: node "$CLI" upgrade --no-install --yes
      - name: Match a project generated from the pinned Starter
        shell: bash
        run: |
          set -euo pipefail
          node "$CLI" "$RUNNER_TEMP/fresh/my-app" --framework ${{ matrix.framework }} ${{ matrix.final }} --no-install --no-git --yes
          diff -r -x .git -x node_modules "$RUNNER_TEMP/upgraded/my-app" "$RUNNER_TEMP/fresh/my-app" > "$RUNNER_TEMP/diff.txt" || true
          cat "$RUNNER_TEMP/diff.txt"
          # Our README line is the only difference.
          test "$(grep -c '^[<>]' "$RUNNER_TEMP/diff.txt")" = 1
          grep -qx '< Notes of our own.' "$RUNNER_TEMP/diff.txt"
      - name: Install, lint, typecheck, test, and build the upgraded project
        working-directory: ${{ runner.temp }}/upgraded/my-app
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

  latest-starter-compatibility:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [next, tanstack-start]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install CLI dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate a project from Starter main
        run: |
          pnpm build
          node bin/create.mjs "$RUNNER_TEMP/generated-app" --ref main --framework ${{ matrix.framework }} ${{ matrix.modules }} --no-git --no-install --yes
      - name: Install generated project dependencies
        working-directory: ${{ runner.temp }}/generated-app
        run: pnpm install --frozen-lockfile
      - name: Verify latest Starter compatibility
        working-directory: ${{ runner.temp }}/generated-app
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
