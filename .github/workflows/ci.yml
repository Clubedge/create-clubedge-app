name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  generated-project:
    name: generated-project (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: next-default, framework: next, modules: "" }
          - { name: next-minimal, framework: next, modules: --auth none --storage none --cache memory --infra none }
          - { name: next-better-auth, framework: next, modules: --auth better-auth --storage none }
          - { name: next-supabase-infra, framework: next, modules: --infra supabase --storage supabase }
          - { name: start-default, framework: tanstack-start, modules: "" }
          - { name: start-minimal, framework: tanstack-start, modules: --auth none --storage none --cache memory --infra none }
          - { name: start-better-auth, framework: tanstack-start, modules: --auth better-auth --cache memory }
          - { name: start-local, framework: tanstack-start, modules: --infra local --auth better-auth }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install CLI dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the CLI and bundle the pinned Starter release
        run: |
          pnpm build
          pnpm bundle-template
      - name: Generate a project from the packed CLI, exactly as it would be published
        shell: bash
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/packed-cli"
          tar -xzf "$RUNNER_TEMP"/clubedge-create-clubedge-app-*.tgz -C "$RUNNER_TEMP/packed-cli"
          npm install --prefix "$RUNNER_TEMP/packed-cli/package" --omit=dev --ignore-scripts
          node "$RUNNER_TEMP/packed-cli/package/bin/create.mjs"             "$RUNNER_TEMP/generated-app" --framework ${{ matrix.framework }} ${{ matrix.modules }} --no-git --no-install --yes
          # npm strips .gitignore from tarballs; the CLI must restore it.
          test -f "$RUNNER_TEMP/generated-app/.gitignore"
      - name: Install generated project dependencies
        working-directory: ${{ runner.temp }}/generated-app
        run: pnpm install --frozen-lockfile
      - name: Lint generated project
        working-directory: ${{ runner.temp }}/generated-app
        run: pnpm lint
      - name: Typecheck generated project
        working-directory: ${{ runner.temp }}/generated-app
        run: pnpm typecheck
      - name: Test generated project
        working-directory: ${{ runner.temp }}/generated-app
        run: pnpm test
      - name: Install Playwright browser
        working-directory: ${{ runner.temp }}/generated-app
        run: pnpm exec playwright install --with-deps chromium
      - name: Run generated project browser checks
        working-directory: ${{ runner.temp }}/generated-app
        run: pnpm test:e2e
      - name: Build generated project
        working-directory: ${{ runner.temp }}/generated-app
        run: pnpm build
      - name: Start app and verify routes
        working-directory: ${{ runner.temp }}/generated-app
        run: |
          set -euo pipefail
          pnpm start > "$RUNNER_TEMP/clubedge-next.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          APP_BASE_URL="http://127.0.0.1:3000" node "$GITHUB_WORKSPACE/scripts/smoke-generated-app.mjs"

  # add and remove on a project with an edit of its own: after several changes, the project must
  # match one generated with the final selection, apart from that edit, and still build.
  change-modules:
    name: change-modules (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [next, tanstack-start]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Build, bundle, and pack the CLI
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build
          pnpm bundle-template
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/packed-cli"
          tar -xzf "$RUNNER_TEMP"/clubedge-create-clubedge-app-*.tgz -C "$RUNNER_TEMP/packed-cli"
          npm install --prefix "$RUNNER_TEMP/packed-cli/package" --omit=dev --ignore-scripts
          echo "CLI=$RUNNER_TEMP/packed-cli/package/bin/create.mjs" >> "$GITHUB_ENV"
      - name: Generate a project and change it
        shell: bash
        run: |
          set -euo pipefail
          node "$CLI" "$RUNNER_TEMP/changed/my-app" --framework ${{ matrix.framework }} --no-install --yes
          cd "$RUNNER_TEMP/changed/my-app"
          git config user.email ci@example.com
          git config user.name CI
          git add -A
          git commit -qm "Generated project"
          echo "Notes of our own." >> README.md
          git commit -qam "Our change"
      - name: Change modules one at a time
        working-directory: ${{ runner.temp }}/changed/my-app
        shell: bash
        run: |
          set -euo pipefail
          for change in "add auth better-auth" "remove storage" "add cache memory" "add infra local"; do
            echo "::group::$change"
            node "$CLI" $change --no-install --yes
            git add -A
            git commit -qm "$change"
            echo "::endgroup::"
          done
      - name: Match a project generated with the final selection
        shell: bash
        run: |
          set -euo pipefail
          node "$CLI" "$RUNNER_TEMP/fresh/my-app" --framework ${{ matrix.framework }} \
            --auth better-auth --storage none --cache memory --infra local --no-install --no-git --yes
          diff -r -x .git -x node_modules "$RUNNER_TEMP/changed/my-app" "$RUNNER_TEMP/fresh/my-app" > "$RUNNER_TEMP/diff.txt" || true
          cat "$RUNNER_TEMP/diff.txt"
          # Our README line is the only difference.
          test "$(grep -c '^[<>]' "$RUNNER_TEMP/diff.txt")" = 1
          grep -qx '< Notes of our own.' "$RUNNER_TEMP/diff.txt"
      - name: Install, lint, typecheck, test, and build the changed project
        working-directory: ${{ runner.temp }}/changed/my-app
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

  latest-starter-compatibility:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [next, tanstack-start]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install CLI dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate a project from Starter main
        run: |
          pnpm build
          node bin/create.mjs "$RUNNER_TEMP/generated-app" --ref main --framework ${{ matrix.framework }} ${{ matrix.modules }} --no-git --no-install --yes
      - name: Install generated project dependencies
        working-directory: ${{ runner.temp }}/generated-app
        run: pnpm install --frozen-lockfile
      - name: Verify latest Starter compatibility
        working-directory: ${{ runner.temp }}/generated-app
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
