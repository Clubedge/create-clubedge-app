name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  mcp-package-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm bundle-template
      - name: Pack and install the published package shape
        shell: bash
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/packed-cli"
          tar -xzf "$RUNNER_TEMP"/clubedge-create-clubedge-app-*.tgz -C "$RUNNER_TEMP/packed-cli"
          npm install --prefix "$RUNNER_TEMP/packed-cli/package" --omit=dev --ignore-scripts
      - name: Exercise the packed MCP server and skill
        run: node scripts/smoke-mcp-package.mjs "$RUNNER_TEMP/packed-cli/package"

  # Windows runs commands through cmd.exe and has drive roots and CRLF checkouts, which have
  # broken the CLI before; these jobs keep it working there.
  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  generated-project-windows:
    name: generated-project-windows (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: next-default, framework: next, modules: "", change: add cache memory, final: --cache memory }
          - {
              name: start-local,
              framework: tanstack-start,
              modules: --infra local --auth better-auth,
              change: remove storage,
              final: --infra local --auth better-auth --storage none,
            }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Build, bundle, and pack the CLI
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build
          pnpm bundle-template
          temp="$(cygpath -u "$RUNNER_TEMP")"
          npm pack --pack-destination "$temp"
          mkdir -p "$temp/packed-cli"
          tar -xzf "$temp"/clubedge-create-clubedge-app-*.tgz -C "$temp/packed-cli"
          npm install --prefix "$temp/packed-cli/package" --omit=dev --ignore-scripts
          echo "CLI=$temp/packed-cli/package/bin/create.mjs" >> "$GITHUB_ENV"
          echo "TEMP_DIR=$temp" >> "$GITHUB_ENV"
      - name: Generate a project
        run: |
          set -euo pipefail
          node "$CLI" "$TEMP_DIR/changed/my-app" --framework ${{ matrix.framework }} ${{ matrix.modules }} --no-install --yes
          cd "$TEMP_DIR/changed/my-app"
          git config user.email ci@example.com
          git config user.name CI
          git add -A
          git commit -qm "Generated project"
          echo "Notes of our own." >> README.md
          git commit -qam "Our change"
      - name: Change a module and match a project generated with that selection
        run: |
          set -euo pipefail
          cd "$TEMP_DIR/changed/my-app"
          node "$CLI" ${{ matrix.change }} --no-install --yes
          node "$CLI" "$TEMP_DIR/fresh/my-app" --framework ${{ matrix.framework }} ${{ matrix.final }} --no-install --no-git --yes
          diff -r -x .git "$TEMP_DIR/changed/my-app" "$TEMP_DIR/fresh/my-app" > "$TEMP_DIR/diff.txt" || true
          cat "$TEMP_DIR/diff.txt"
          # Our README line is the only difference.
          test "$(grep -c '^[<>]' "$TEMP_DIR/diff.txt")" = 1
          grep -qx '< Notes of our own.' "$TEMP_DIR/diff.txt"
      - name: Install, lint, typecheck, test, and build the changed project
        working-directory: ${{ runner.temp }}/changed/my-app
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/ci/check-project.sh" install format:check lint typecheck test build

  generated-project-macos:
    name: generated-project-macos (${{ matrix.name }})
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: next-default, framework: next, modules: "", change: add cache memory, final: --cache memory }
          - {
              name: start-local,
              framework: tanstack-start,
              modules: --infra local --auth better-auth,
              change: remove storage,
              final: --infra local --auth better-auth --storage none,
            }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Build, bundle, and pack the CLI
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build
          pnpm bundle-template
          temp="$RUNNER_TEMP"
          npm pack --pack-destination "$temp"
          mkdir -p "$temp/packed-cli"
          tar -xzf "$temp"/clubedge-create-clubedge-app-*.tgz -C "$temp/packed-cli"
          npm install --prefix "$temp/packed-cli/package" --omit=dev --ignore-scripts
          echo "CLI=$temp/packed-cli/package/bin/create.mjs" >> "$GITHUB_ENV"
          echo "TEMP_DIR=$temp" >> "$GITHUB_ENV"
      - name: Generate a project
        run: |
          set -euo pipefail
          node "$CLI" "$TEMP_DIR/changed/my-app" --framework ${{ matrix.framework }} ${{ matrix.modules }} --no-install --yes
          cd "$TEMP_DIR/changed/my-app"
          git config user.email ci@example.com
          git config user.name CI
          git add -A
          git commit -qm "Generated project"
          echo "Notes of our own." >> README.md
          git commit -qam "Our change"
      - name: Change a module and match a project generated with that selection
        run: |
          set -euo pipefail
          cd "$TEMP_DIR/changed/my-app"
          node "$CLI" ${{ matrix.change }} --no-install --yes
          node "$CLI" "$TEMP_DIR/fresh/my-app" --framework ${{ matrix.framework }} ${{ matrix.final }} --no-install --no-git --yes
          diff -r -x .git "$TEMP_DIR/changed/my-app" "$TEMP_DIR/fresh/my-app" > "$TEMP_DIR/diff.txt" || true
          cat "$TEMP_DIR/diff.txt"
          # Our README line is the only difference.
          test "$(grep -c '^[<>]' "$TEMP_DIR/diff.txt")" = 1
          grep -qx '< Notes of our own.' "$TEMP_DIR/diff.txt"
      - name: Install, lint, typecheck, test, and build the changed project
        working-directory: ${{ runner.temp }}/changed/my-app
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/ci/check-project.sh" install format:check lint typecheck test build

  generated-project:
    name: generated-project (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: next-default, framework: next, modules: "" }
          - { name: next-fly, framework: next, modules: --deploy fly --auth better-auth }
          - { name: next-minimal, framework: next, modules: --auth none --storage none --cache memory --infra none --email none }
          - { name: next-better-auth, framework: next, modules: --auth better-auth --storage none --email resend }
          - { name: next-supabase-infra, framework: next, modules: --infra supabase --storage supabase }
          - { name: start-default, framework: tanstack-start, modules: "" }
          - { name: start-vercel, framework: tanstack-start, modules: --deploy vercel }
          - { name: start-minimal, framework: tanstack-start, modules: --auth none --storage none --cache memory --infra none --email none }
          - { name: start-better-auth, framework: tanstack-start, modules: --auth better-auth --cache memory --payments stripe --jobs pg-boss --observability sentry }
          - { name: start-local, framework: tanstack-start, modules: --infra local --auth better-auth }
          # A frontend and a separate API, joined by the Starter's HTTP contract.
          - { name: vite-hono, framework: vite, modules: --api hono }
          - { name: vite-fastapi, framework: vite, modules: --api fastapi }
          # The same frontend, packaged as a mobile app with Capacitor.
          - { name: vite-hono-capacitor, framework: vite, modules: --api hono --shell capacitor }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      # A Python API (--api fastapi) runs its lint, typecheck, and tests with uv.
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install CLI dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the CLI and bundle the pinned Starter release
        run: |
          pnpm build
          pnpm bundle-template
      - name: Generate a project from the packed CLI, exactly as it would be published
        shell: bash
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/packed-cli"
          tar -xzf "$RUNNER_TEMP"/clubedge-create-clubedge-app-*.tgz -C "$RUNNER_TEMP/packed-cli"
          npm install --prefix "$RUNNER_TEMP/packed-cli/package" --omit=dev --ignore-scripts
          node "$RUNNER_TEMP/packed-cli/package/bin/create.mjs"             "$RUNNER_TEMP/generated-app" --framework ${{ matrix.framework }} ${{ matrix.modules }} --no-git --no-install --yes
          # npm strips .gitignore from tarballs; the CLI must restore it.
          test -f "$RUNNER_TEMP/generated-app/.gitignore"
      - name: Install generated project dependencies
        working-directory: ${{ runner.temp }}/generated-app
        run: pnpm install --frozen-lockfile
      - name: Lint generated project
        working-directory: ${{ runner.temp }}/generated-app
        run: pnpm lint
      - name: Typecheck generated project
        working-directory: ${{ runner.temp }}/generated-app
        run: pnpm typecheck
      - name: Test generated project
        working-directory: ${{ runner.temp }}/generated-app
        run: pnpm test
      - name: Install Playwright browser
        working-directory: ${{ runner.temp }}/generated-app
        run: pnpm exec playwright install --with-deps chromium
      - name: Run generated project browser checks
        working-directory: ${{ runner.temp }}/generated-app
        run: pnpm test:e2e
      - name: Build generated project
        working-directory: ${{ runner.temp }}/generated-app
        run: pnpm build
      - name: Start app and verify routes
        working-directory: ${{ runner.temp }}/generated-app
        run: |
          set -euo pipefail
          pnpm start > "$RUNNER_TEMP/clubedge-next.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          APP_BASE_URL="http://127.0.0.1:3000" node "$GITHUB_WORKSPACE/scripts/smoke-generated-app.mjs"

  # deploy with Docker writes compose.yaml, a Caddyfile, and a workflow that publishes the images:
  # Compose, Caddy, and actionlint must accept what it writes for each kind of project.
  docker-deploy:
    name: docker-deploy (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: next, framework: next, modules: "" }
          - { name: start-better-auth, framework: tanstack-start, modules: --auth better-auth }
          - { name: vite-hono, framework: vite, modules: --api hono --auth better-auth }
          - { name: vite-fastapi, framework: vite, modules: --api fastapi --auth supabase }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Build, bundle, and pack the CLI
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build
          pnpm bundle-template
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/packed-cli"
          tar -xzf "$RUNNER_TEMP"/clubedge-create-clubedge-app-*.tgz -C "$RUNNER_TEMP/packed-cli"
          npm install --prefix "$RUNNER_TEMP/packed-cli/package" --omit=dev --ignore-scripts
          echo "CLI=$RUNNER_TEMP/packed-cli/package/bin/create.mjs" >> "$GITHUB_ENV"
      - name: Generate a project and write its Docker deploy files
        shell: bash
        run: |
          set -euo pipefail
          node "$CLI" "$RUNNER_TEMP/app" --framework ${{ matrix.framework }} ${{ matrix.modules }} --deploy docker --no-install --yes
          cd "$RUNNER_TEMP/app"
          git remote add origin https://github.com/Clubedge/Example-App.git
          node "$CLI" deploy | tee "$RUNNER_TEMP/deploy.txt"
          grep -q "IMAGE_PREFIX=ghcr.io/clubedge/example-app" "$RUNNER_TEMP/deploy.txt"
          test -f compose.yaml && test -f Caddyfile && test -f .github/workflows/release-images.yml
      - name: Compose accepts compose.yaml, and requires DOMAIN
        working-directory: ${{ runner.temp }}/app
        shell: bash
        run: |
          set -euo pipefail
          DOMAIN=example.com IMAGE_PREFIX=ghcr.io/clubedge/example-app docker compose config | tee "$RUNNER_TEMP/config.yaml"
          grep -q "image: ghcr.io/clubedge/example-app-web:latest" "$RUNNER_TEMP/config.yaml"
          # The public URL defaults to https://$DOMAIN, a default within a default.
          if grep -q 'https://${DOMAIN}' compose.yaml; then grep -Eq ': https://example\.com$' "$RUNNER_TEMP/config.yaml"; fi
          if docker compose config --quiet 2> "$RUNNER_TEMP/missing.txt"; then echo "compose.yaml must require DOMAIN"; exit 1; fi
          grep -q "Set DOMAIN in .env.production" "$RUNNER_TEMP/missing.txt"
      - name: Caddy accepts the Caddyfile
        working-directory: ${{ runner.temp }}/app
        run: docker run --rm -e DOMAIN=example.com -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: actionlint accepts the release workflow
        working-directory: ${{ runner.temp }}/app
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color .github/workflows/release-images.yml

  # add and remove on a project with an edit of its own: after several changes, the project must
  # match one generated with the final selection, apart from that edit, and still build.
  change-modules:
    name: change-modules (${{ matrix.framework }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [next, tanstack-start]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Build, bundle, and pack the CLI
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build
          pnpm bundle-template
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/packed-cli"
          tar -xzf "$RUNNER_TEMP"/clubedge-create-clubedge-app-*.tgz -C "$RUNNER_TEMP/packed-cli"
          npm install --prefix "$RUNNER_TEMP/packed-cli/package" --omit=dev --ignore-scripts
          echo "CLI=$RUNNER_TEMP/packed-cli/package/bin/create.mjs" >> "$GITHUB_ENV"
      - name: Generate a project and change it
        shell: bash
        run: |
          set -euo pipefail
          node "$CLI" "$RUNNER_TEMP/changed/my-app" --framework ${{ matrix.framework }} --no-install --yes
          cd "$RUNNER_TEMP/changed/my-app"
          git config user.email ci@example.com
          git config user.name CI
          git add -A
          git commit -qm "Generated project"
          echo "Notes of our own." >> README.md
          git commit -qam "Our change"
      - name: Change modules one at a time
        working-directory: ${{ runner.temp }}/changed/my-app
        shell: bash
        run: |
          set -euo pipefail
          for change in "add auth better-auth" "remove storage" "add cache memory" "add infra local" "add email resend payments stripe" "add jobs pg-boss observability otel"; do
            echo "::group::$change"
            node "$CLI" $change --no-install --yes
            git add -A
            git commit -qm "$change"
            echo "::endgroup::"
          done
      - name: Match a project generated with the final selection
        shell: bash
        run: |
          set -euo pipefail
          node "$CLI" "$RUNNER_TEMP/fresh/my-app" --framework ${{ matrix.framework }} \
            --auth better-auth --storage none --cache memory --infra local --email resend --payments stripe --jobs pg-boss --observability otel --no-install --no-git --yes
          diff -r -x .git -x node_modules "$RUNNER_TEMP/changed/my-app" "$RUNNER_TEMP/fresh/my-app" > "$RUNNER_TEMP/diff.txt" || true
          cat "$RUNNER_TEMP/diff.txt"
          # Our README line is the only difference.
          test "$(grep -c '^[<>]' "$RUNNER_TEMP/diff.txt")" = 1
          grep -qx '< Notes of our own.' "$RUNNER_TEMP/diff.txt"
      - name: Install, lint, typecheck, test, and build the changed project
        working-directory: ${{ runner.temp }}/changed/my-app
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/ci/check-project.sh" install lint typecheck test build

  # upgrade from an earlier Starter release to the pinned one on a project with an edit of its
  # own: the result must match a project generated from the pinned release, apart from that edit.
  upgrade-project:
    name: upgrade-project (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both predate the email module, so the upgrade adds it as none.
          - { name: next-from-v0.6.0, framework: next, from: v0.6.0, modules: "", final: --email none }
          # v0.5.0 predates the infra module, so the upgrade adds it as none.
          - {
              name: start-from-v0.5.0,
              framework: tanstack-start,
              from: v0.5.0,
              modules: --auth better-auth,
              final: --auth better-auth --infra none --email none,
            }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Build, bundle, and pack the CLI
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build
          pnpm bundle-template
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/packed-cli"
          tar -xzf "$RUNNER_TEMP"/clubedge-create-clubedge-app-*.tgz -C "$RUNNER_TEMP/packed-cli"
          npm install --prefix "$RUNNER_TEMP/packed-cli/package" --omit=dev --ignore-scripts
          echo "CLI=$RUNNER_TEMP/packed-cli/package/bin/create.mjs" >> "$GITHUB_ENV"
      - name: Generate a project from ${{ matrix.from }} and change it
        shell: bash
        run: |
          set -euo pipefail
          node "$CLI" "$RUNNER_TEMP/upgraded/my-app" --ref ${{ matrix.from }} --framework ${{ matrix.framework }} ${{ matrix.modules }} --no-install --yes
          cd "$RUNNER_TEMP/upgraded/my-app"
          git config user.email ci@example.com
          git config user.name CI
          git add -A
          git commit -qm "Generated project"
          echo "Notes of our own." >> README.md
          git commit -qam "Our change"
      - name: Upgrade to the pinned Starter
        working-directory: ${{ runner.temp }}/upgraded/my-app
        run: node "$CLI" upgrade --no-install --yes
      - name: Match a project generated from the pinned Starter
        shell: bash
        run: |
          set -euo pipefail
          node "$CLI" "$RUNNER_TEMP/fresh/my-app" --framework ${{ matrix.framework }} ${{ matrix.final }} --no-install --no-git --yes
          diff -r -x .git -x node_modules "$RUNNER_TEMP/upgraded/my-app" "$RUNNER_TEMP/fresh/my-app" > "$RUNNER_TEMP/diff.txt" || true
          cat "$RUNNER_TEMP/diff.txt"
          # Our README line is the only difference.
          test "$(grep -c '^[<>]' "$RUNNER_TEMP/diff.txt")" = 1
          grep -qx '< Notes of our own.' "$RUNNER_TEMP/diff.txt"
      - name: Install, lint, typecheck, test, and build the upgraded project
        working-directory: ${{ runner.temp }}/upgraded/my-app
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/ci/check-project.sh" install lint typecheck test build

  # Edits that overlap the Starter's in a package.json, which pnpm cannot read with conflict
  # markers: the CLI must skip pnpm install, report the conflict, and explain the file to later
  # commands. The upgrade fetches the project's own Starter revision from GitHub, on Windows too.
  package-json-conflicts:
    name: package-json-conflicts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Build, bundle, and pack the CLI
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build
          pnpm bundle-template
          temp="$RUNNER_TEMP"
          if command -v cygpath >/dev/null; then temp="$(cygpath -u "$RUNNER_TEMP")"; fi
          npm pack --pack-destination "$temp"
          mkdir -p "$temp/packed-cli"
          tar -xzf "$temp"/clubedge-create-clubedge-app-*.tgz -C "$temp/packed-cli"
          npm install --prefix "$temp/packed-cli/package" --omit=dev --ignore-scripts
          echo "CLI=$temp/packed-cli/package/bin/create.mjs" >> "$GITHUB_ENV"
          echo "TEMP_DIR=$temp" >> "$GITHUB_ENV"
      - name: Upgrade, add, and upgrade again with conflicts in package.json files
        # Any release before the pinned one works: each changes every package.json's version.
        run: bash scripts/ci/package-json-conflicts.sh "$CLI" "$TEMP_DIR/conflicts" v0.24.2

  latest-starter-compatibility:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [next, tanstack-start]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Install CLI dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate a project from Starter main
        run: |
          pnpm build
          node bin/create.mjs "$RUNNER_TEMP/generated-app" --ref main --framework ${{ matrix.framework }} ${{ matrix.modules }} --no-git --no-install --yes
      - name: Install generated project dependencies
        working-directory: ${{ runner.temp }}/generated-app
        run: pnpm install --frozen-lockfile
      - name: Verify latest Starter compatibility
        working-directory: ${{ runner.temp }}/generated-app
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
