name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Install npm Trusted Publishing client
        run: npm install --global npm@11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Bundle the pinned Starter release
        run: pnpm bundle-template
      - name: Confirm package version matches tag
        shell: bash
        run: test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME#v}"
      - name: Publish package
        run: npm publish --access public --provenance

  published-package-smoke:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [next, tanstack-start]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Wait for npm package availability
        shell: bash
        run: |
          for attempt in {1..30}; do
            if npm view "@clubedge/create-clubedge-app@${GITHUB_REF_NAME#v}" version 2>/dev/null | grep -Fx "${GITHUB_REF_NAME#v}"; then
              exit 0
            fi
            sleep 10
          done
          echo "Published package did not become available on npm."
          exit 1
      - name: Generate from the published package
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/generated-app"
          for attempt in {1..30}; do
            rm -f "$RUNNER_TEMP/clubedge-create-clubedge-app.tgz"
            if npm pack "@clubedge/create-clubedge-app@${GITHUB_REF_NAME#v}" \
              --pack-destination "$RUNNER_TEMP" >/dev/null 2>&1; then
              package_tarball="$RUNNER_TEMP/clubedge-create-clubedge-app-${GITHUB_REF_NAME#v}.tgz"
              if [ -f "$package_tarball" ]; then
                  package_dir="$RUNNER_TEMP/published-cli"
                  rm -rf "$package_dir"
                  mkdir -p "$package_dir" "$RUNNER_TEMP/generated-app"
                  tar -xzf "$package_tarball" -C "$package_dir"
                  npm install --prefix "$package_dir/package" --omit=dev --ignore-scripts
                  node "$package_dir/package/bin/create.mjs" \
                    "$RUNNER_TEMP/generated-app" --framework ${{ matrix.framework }} --no-git --no-install --yes
                  test -f "$RUNNER_TEMP/generated-app/package.json"
                  # npm strips .gitignore from tarballs; the CLI must restore it.
                  test -f "$RUNNER_TEMP/generated-app/.gitignore"
                  exit 0
              fi
            fi
            sleep 10
          done
          echo "Published package tarball did not become available on npm."
          exit 1
      - name: Verify published package provenance
        working-directory: ${{ runner.temp }}/generated-app
        shell: bash
        env:
          FRAMEWORK: ${{ matrix.framework }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const manifest = JSON.parse(await readFile("package.json", "utf8"));
          const expectedVersion = process.env.GITHUB_REF_NAME.slice(1);
          if (manifest.clubedge?.cliVersion !== expectedVersion) {
            throw new Error(`Expected CLI ${expectedVersion}, got ${manifest.clubedge?.cliVersion}`);
          }
          const { clubedge: pin } = JSON.parse(
            await readFile(`${process.env.GITHUB_WORKSPACE}/package.json`, "utf8"),
          );
          if (manifest.clubedge?.starterRef !== pin.starterRef) {
            throw new Error(`Expected Starter ${pin.starterRef}, got ${manifest.clubedge?.starterRef}`);
          }
          if (manifest.clubedge?.starterCommit !== pin.starterCommit) {
            throw new Error(`Unexpected Starter commit: ${manifest.clubedge?.starterCommit}`);
          }
          if (manifest.clubedge?.framework !== process.env.FRAMEWORK) {
            throw new Error(`Expected framework ${process.env.FRAMEWORK}, got ${manifest.clubedge?.framework}`);
          }
          NODE
      - name: Verify generated application
        working-directory: ${{ runner.temp }}/generated-app
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build

  refresh-site:
    needs: published-package-smoke
    runs-on: ubuntu-latest
    steps:
      # The site also refreshes release data at runtime; the rebuild keeps its static HTML current.
      - name: Trigger site rebuild
        env:
          SITE_DEPLOY_HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
        run: |
          if [ -z "$SITE_DEPLOY_HOOK" ]; then
            echo "SITE_DEPLOY_HOOK is not configured; skipping the site rebuild."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$SITE_DEPLOY_HOOK" > /dev/null
          echo "Site rebuild triggered."
