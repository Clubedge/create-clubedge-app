name: Showcase

# Builds the examples on starter.clubedge.live from the published CLI: screenshots of the default
# project's production server, and a walkthrough video per example that mixes the terminal (real
# commands, recorded in a pty) with the browser (the running app, driven by Playwright). Run it by
# hand after a release and copy the artifacts into the site.
on:
  workflow_dispatch:
    inputs:
      cli-version:
        description: Published CLI version to generate with
        default: latest
  pull_request:
    paths:
      - .github/workflows/showcase.yml
      - scripts/capture-showcase.mjs
      - scripts/showcase/**

permissions:
  contents: read

jobs:
  default-project:
    name: showcase (default project)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLI_VERSION: ${{ inputs.cli-version || 'latest' }}
      # The default modules, with Supabase (the default auth) and storage running locally, so the
      # whole app, sign-in included, works on the runner. CI tests the same selection as
      # generated-project (next-supabase-infra).
      FLAGS: --infra supabase --storage supabase
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Generate the project with the published CLI
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          version="$(npm view "@clubedge/create-clubedge-app@$CLI_VERSION" version)"
          echo "CLI_RESOLVED=$version" >> "$GITHUB_ENV"
          echo "APP=$RUNNER_TEMP/my-app" >> "$GITHUB_ENV"
          pnpm dlx "@clubedge/create-clubedge-app@$version" my-app $FLAGS --no-install --yes
      - name: Install
        working-directory: ${{ env.APP }}
        run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, and test
        working-directory: ${{ env.APP }}
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Start local Supabase
        working-directory: ${{ env.APP }}
        run: pnpm infra:up
      - name: Use the local Supabase keys and database
        working-directory: ${{ env.APP }}
        run: |
          set -euo pipefail
          eval "$(npx --yes supabase@2 status -o env)"
          key="${PUBLISHABLE_KEY:-$ANON_KEY}"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$key"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$key"
            echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
            echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          } >> "$GITHUB_ENV"
      - name: Migrate and check every service
        working-directory: ${{ env.APP }}
        run: |
          pnpm db:migrate
          pnpm check:services
      - name: Browser checks (sign up, out and in, password reset, settings, readiness)
        working-directory: ${{ env.APP }}
        env:
          E2E_AUTH_FLOW: "1"
          E2E_DATABASE: "1"
          E2E_MAIL_API: http://127.0.0.1:54324
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e e2e/auth-flow.spec.ts e2e/password-reset.spec.ts e2e/ready.spec.ts e2e/settings.spec.ts
      - name: Production build
        working-directory: ${{ env.APP }}
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
        run: pnpm build
      - name: Capture screenshots of the production server
        working-directory: ${{ env.APP }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/showcase"
          pnpm start > "$RUNNER_TEMP/app.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/app.log"' EXIT
          timeout 60 bash -c 'until curl -fs http://127.0.0.1:3000 > /dev/null; do sleep 1; done'
          cp "$GITHUB_WORKSPACE/scripts/capture-showcase.mjs" scripts/
          node scripts/capture-showcase.mjs "$out/screenshots"
          rm scripts/capture-showcase.mjs
      - name: Record versions, command, checks, and file tree
        working-directory: ${{ env.APP }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/showcase"
          find . -path ./node_modules -prune -o -path '*/node_modules' -prune -o -path '*/.next' -prune \
            -o -path ./.turbo -prune -o -path '*/.turbo' -prune -o -path ./test-results -prune \
            -o -type f -print | sed 's|^\./||' | sort > "$out/files.txt"
          node -e '
            const pkg = require("./package.json");
            const out = {
              example: "default",
              cliVersion: process.env.CLI_RESOLVED,
              starter: pkg.clubedge,
              command: `pnpm dlx @clubedge/create-clubedge-app my-app ${process.env.FLAGS}`,
              checks: ["pnpm install --frozen-lockfile", "pnpm lint", "pnpm typecheck", "pnpm test",
                "pnpm check:services", "browser: sign up, sign out and in, password reset, settings, readiness",
                "pnpm build", "production server screenshots"],
              capturedAt: new Date().toISOString(),
              run: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            };
            require("fs").writeFileSync(process.argv[1], JSON.stringify(out, null, 2) + "\n");
          ' "$out/showcase.json"
          cat "$out/showcase.json"
      - name: Stop local Supabase
        if: always()
        working-directory: ${{ env.APP }}
        run: pnpm infra:down || true
      - name: Upload the showcase
        uses: actions/upload-artifact@v4
        with:
          name: showcase-default
          path: ${{ runner.temp }}/showcase
      - name: Upload browser test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-playwright
          path: ${{ env.APP }}/test-results
          if-no-files-found: ignore

  walkthrough:
    name: walkthrough (${{ matrix.example }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        example: [default, saas, start-local, minimal, evolution]
    env:
      CLI_VERSION: ${{ inputs.cli-version || 'latest' }}
      BETTER_AUTH_SECRET: showcase-only-better-auth-secret-0123456789abcdef
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_TEST_PRICE_PRO: ${{ secrets.STRIPE_TEST_PRICE_PRO }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install the recording tools
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-jetbrains-mono
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/tools"
          gh release download -R asciinema/agg -p 'agg-x86_64-unknown-linux-gnu' -O "$RUNNER_TEMP/bin/agg"
          chmod +x "$RUNNER_TEMP/bin/agg"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          cp scripts/showcase/* "$RUNNER_TEMP/tools/"
          cd "$RUNNER_TEMP/tools"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.55
          npx playwright install --with-deps chromium
          git config --global user.name "Clubedge Showcase"
          git config --global user.email showcase@clubedge.live
          git config --global init.defaultBranch main
          echo "CLI_RESOLVED=$(npm view "@clubedge/create-clubedge-app@$CLI_VERSION" version)" >> "$GITHUB_ENV"
      - name: Forward Stripe test-mode webhooks
        if: (matrix.example == 'saas' || matrix.example == 'evolution') && env.STRIPE_TEST_SECRET_KEY != ''
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        run: |
          set -euo pipefail
          gh release download -R stripe/stripe-cli -p 'stripe_*_linux_x86_64.tar.gz' -O "$RUNNER_TEMP/stripe.tar.gz"
          tar -xzf "$RUNNER_TEMP/stripe.tar.gz" -C "$RUNNER_TEMP/bin" stripe
          # The price secret may hold the product's id (prod_...): use that product's default price.
          price="$STRIPE_TEST_PRICE_PRO"
          if [[ "$price" == prod_* ]]; then
            price="$(curl -fsS -u "$STRIPE_API_KEY:" "https://api.stripe.com/v1/products/$price" | jq -r '.default_price // empty')"
            test -n "$price" || { echo "The Stripe product has no default price." >&2; exit 1; }
          fi
          echo "STRIPE_PRICE_RESOLVED=$price" >> "$GITHUB_ENV"
          secret="$("$RUNNER_TEMP/bin/stripe" listen --print-secret)"
          echo "::add-mask::$secret"
          echo "STRIPE_LISTEN_SECRET=$secret" >> "$GITHUB_ENV"
          # The events the Starter's webhook handles (packages/payments-stripe).
          events=customer.subscription.created,customer.subscription.updated,customer.subscription.deleted,customer.subscription.paused,customer.subscription.resumed,checkout.session.completed
          nohup "$RUNNER_TEMP/bin/stripe" listen --events "$events" --forward-to http://localhost:3000/api/webhooks/payments \
            > "$RUNNER_TEMP/stripe-listen.log" 2>&1 &
      - name: Record the walkthrough
        run: |
          node --experimental-strip-types "$RUNNER_TEMP/tools/director.mjs" ${{ matrix.example }} \
            "$RUNNER_TEMP/work" "$RUNNER_TEMP/out"
      - name: Compose the video
        run: node "$RUNNER_TEMP/tools/compose.mjs" "$RUNNER_TEMP/out"
      - name: Lint, typecheck, test, and build the project
        working-directory: ${{ runner.temp }}/work/my-app
        run: |
          set -euo pipefail
          # Stop the dev server the walkthrough left running.
          for pid in "$RUNNER_TEMP"/out/state/*.pid; do [ -f "$pid" ] && kill -INT -- "-$(cat "$pid")" 2>/dev/null || true; done
          sleep 3
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Record versions and checks
        working-directory: ${{ runner.temp }}/work/my-app
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const file = process.argv[1];
            const walkthrough = JSON.parse(fs.readFileSync(file, "utf8"));
            const pkg = require("./package.json");
            Object.assign(walkthrough, {
              cliVersion: process.env.CLI_RESOLVED,
              origin: pkg.clubedge,
              checks: ["pnpm lint", "pnpm typecheck", "pnpm test", "pnpm build"],
              capturedAt: new Date().toISOString(),
              run: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });
            fs.writeFileSync(file, JSON.stringify(walkthrough, null, 2));
          ' "$RUNNER_TEMP/out/walkthrough.json"
          mkdir -p "$RUNNER_TEMP/publish"
          cp "$RUNNER_TEMP/out/walkthrough.mp4" "$RUNNER_TEMP/out/poster.jpg" "$RUNNER_TEMP/out/walkthrough.json" "$RUNNER_TEMP/publish/"
          ls -la "$RUNNER_TEMP/publish"
      - name: Stop the local services
        if: always()
        working-directory: ${{ runner.temp }}/work/my-app
        run: |
          for pid in "$RUNNER_TEMP"/out/state/*.pid; do [ -f "$pid" ] && kill -INT -- "-$(cat "$pid")" 2>/dev/null || true; done
          pnpm infra:down 2>/dev/null || true
      - name: Upload the walkthrough
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough-${{ matrix.example }}
          path: ${{ runner.temp }}/publish
          if-no-files-found: ignore
      - name: Upload the raw recording on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough-${{ matrix.example }}-raw
          # Not the Stripe CLI's log: it prints the webhook signing secret.
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore

  # Manual runs publish everything as one GitHub Release, showcase-<run id>, which the site pins
  # in its showcase.lock.json and downloads at build time, so no video is ever committed. Only the
  # newest three showcase releases are kept; older ones and their tags are deleted.
  publish:
    name: publish the showcase
    needs: [default-project, walkthrough]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: showcase-${{ github.run_id }}
      KEEP: 3
    steps:
      - name: Download the results
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts
      - name: Gather the release files
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/artifacts"
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          # One flat set of files: <example>-walkthrough.mp4, <example>-poster.jpg, <example>.json,
          # and the default project's screenshots as default-<page>-<theme>.png.
          for dir in "$src"/walkthrough-*; do
            name="$(basename "$dir")"
            case "$name" in *-raw) continue ;; esac
            example="${name#walkthrough-}"
            cp "$dir/walkthrough.mp4" "$out/$example-walkthrough.mp4"
            cp "$dir/poster.jpg" "$out/$example-poster.jpg"
            cp "$dir/walkthrough.json" "$out/$example.json"
          done
          for png in "$src"/showcase-default/screenshots/*.png; do
            cp "$png" "$out/default-$(basename "$png")"
          done
          cp "$src/showcase-default/showcase.json" "$out/screenshots.json"
          node -e '
            const fs = require("fs");
            const dir = process.argv[1];
            const files = fs.readdirSync(dir).sort();
            const screenshots = JSON.parse(fs.readFileSync(`${dir}/screenshots.json`, "utf8"));
            const manifest = {
              tag: process.env.TAG,
              cliVersion: screenshots.cliVersion,
              starterRef: screenshots.starter.starterRef,
              createdAt: new Date().toISOString(),
              run: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              files,
            };
            fs.writeFileSync(`${dir}/manifest.json`, JSON.stringify(manifest, null, 2) + "\n");
            console.log(JSON.stringify(manifest, null, 2));
          ' "$out"
      - name: Create the release
        run: |
          set -euo pipefail
          version="$(node -p 'require(process.argv[1]).cliVersion' "$RUNNER_TEMP/release/manifest.json")"
          # Never "Latest": that stays the CLI's own release.
          gh release create "$TAG" "$RUNNER_TEMP"/release/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Showcase ($TAG, CLI v$version)" \
            --notes "Walkthrough videos and screenshots for starter.clubedge.live, recorded with the published CLI v$version in [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). The site pins a release in showcase.lock.json. Only the newest $KEEP showcase releases are kept."
      - name: Delete older showcase releases
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("showcase-"))] | sort_by(.createdAt) | reverse | .[(env.KEEP | tonumber):] | .[].tagName' |
            while read -r old; do
              echo "Deleting $old"
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done
