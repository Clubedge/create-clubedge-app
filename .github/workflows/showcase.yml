name: Showcase

# Generates the showcase example from the published CLI, verifies it, and captures screenshots of
# its production server for starter.clubedge.live. Run it by hand after a release; the artifact
# holds the screenshots, showcase.json (versions, command, checks) and the file tree.
on:
  workflow_dispatch:
    inputs:
      cli-version:
        description: Published CLI version to generate with
        default: latest
  pull_request:
    paths:
      - .github/workflows/showcase.yml
      - scripts/capture-showcase.mjs
      - scripts/record-session.py
      - scripts/showcase-evolution.sh

permissions:
  contents: read

jobs:
  default-project:
    name: showcase (default project)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLI_VERSION: ${{ inputs.cli-version || 'latest' }}
      # The default modules, with Supabase (the default auth) and storage running locally, so the
      # whole app, sign-in included, works on the runner. CI tests the same selection as
      # generated-project (next-supabase-infra).
      FLAGS: --infra supabase --storage supabase
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Generate the project with the published CLI
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          version="$(npm view "@clubedge/create-clubedge-app@$CLI_VERSION" version)"
          echo "CLI_RESOLVED=$version" >> "$GITHUB_ENV"
          echo "APP=$RUNNER_TEMP/my-app" >> "$GITHUB_ENV"
          pnpm dlx "@clubedge/create-clubedge-app@$version" my-app $FLAGS --no-install --yes
      - name: Install
        working-directory: ${{ env.APP }}
        run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, and test
        working-directory: ${{ env.APP }}
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Start local Supabase
        working-directory: ${{ env.APP }}
        run: pnpm infra:up
      - name: Use the local Supabase keys and database
        working-directory: ${{ env.APP }}
        run: |
          set -euo pipefail
          eval "$(npx --yes supabase@2 status -o env)"
          key="${PUBLISHABLE_KEY:-$ANON_KEY}"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$key"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$key"
            echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
            echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          } >> "$GITHUB_ENV"
      - name: Migrate and check every service
        working-directory: ${{ env.APP }}
        run: |
          pnpm db:migrate
          pnpm check:services
      - name: Browser checks (sign up, out and in, password reset, settings, readiness)
        working-directory: ${{ env.APP }}
        env:
          E2E_AUTH_FLOW: "1"
          E2E_DATABASE: "1"
          E2E_MAIL_API: http://127.0.0.1:54324
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e e2e/auth-flow.spec.ts e2e/password-reset.spec.ts e2e/ready.spec.ts e2e/settings.spec.ts
      - name: Production build
        working-directory: ${{ env.APP }}
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
        run: pnpm build
      - name: Capture screenshots of the production server
        working-directory: ${{ env.APP }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/showcase"
          pnpm start > "$RUNNER_TEMP/app.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/app.log"' EXIT
          timeout 60 bash -c 'until curl -fs http://127.0.0.1:3000 > /dev/null; do sleep 1; done'
          cp "$GITHUB_WORKSPACE/scripts/capture-showcase.mjs" scripts/
          node scripts/capture-showcase.mjs "$out/screenshots"
          rm scripts/capture-showcase.mjs
      - name: Record versions, command, checks, and file tree
        working-directory: ${{ env.APP }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/showcase"
          find . -path ./node_modules -prune -o -path '*/node_modules' -prune -o -path '*/.next' -prune \
            -o -path ./.turbo -prune -o -path '*/.turbo' -prune -o -path ./test-results -prune \
            -o -type f -print | sed 's|^\./||' | sort > "$out/files.txt"
          node -e '
            const pkg = require("./package.json");
            const out = {
              example: "default",
              cliVersion: process.env.CLI_RESOLVED,
              starter: pkg.clubedge,
              command: `pnpm dlx @clubedge/create-clubedge-app my-app ${process.env.FLAGS}`,
              checks: ["pnpm install --frozen-lockfile", "pnpm lint", "pnpm typecheck", "pnpm test",
                "pnpm check:services", "browser: sign up, sign out and in, password reset, settings, readiness",
                "pnpm build", "production server screenshots"],
              capturedAt: new Date().toISOString(),
              run: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            };
            require("fs").writeFileSync(process.argv[1], JSON.stringify(out, null, 2) + "\n");
          ' "$out/showcase.json"
          cat "$out/showcase.json"
      - name: Stop local Supabase
        if: always()
        working-directory: ${{ env.APP }}
        run: pnpm infra:down || true
      - name: Upload the showcase
        uses: actions/upload-artifact@v4
        with:
          name: showcase-default
          path: ${{ runner.temp }}/showcase
      - name: Upload browser test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-playwright
          path: ${{ env.APP }}/test-results
          if-no-files-found: ignore

  project-evolution:
    name: showcase (project evolution)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLI_VERSION: ${{ inputs.cli-version || 'latest' }}
      FROM_STARTER: v0.14.0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Record create, edit, upgrade, add, and remove in a terminal
        run: |
          set -euo pipefail
          # The session runs `pnpm dlx @clubedge/create-clubedge-app` and `pnpm clubedge`, which
          # resolve the latest published CLI; record which version that was.
          echo "CLI_RESOLVED=$(npm view "@clubedge/create-clubedge-app@$CLI_VERSION" version)" >> "$GITHUB_ENV"
          git config --global user.name "Clubedge Showcase"
          git config --global user.email showcase@clubedge.live
          git config --global init.defaultBranch main
          mkdir -p "$RUNNER_TEMP/session" "$RUNNER_TEMP/showcase"
          python3 scripts/record-session.py 100 30 "$RUNNER_TEMP/showcase/project-evolution.cast" \
            bash scripts/showcase-evolution.sh "$RUNNER_TEMP/session" "$FROM_STARTER"
      - name: Install, lint, typecheck, test, and build the evolved project
        working-directory: ${{ runner.temp }}/session/my-app
        run: |
          pnpm install
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Record versions, chapters, and checks
        working-directory: ${{ runner.temp }}/session/my-app
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const pkg = require("./package.json");
            const cast = fs.readFileSync(process.argv[1], "utf8").trim().split(/\n/).slice(1).map((l) => JSON.parse(l));
            const out = {
              example: "project-evolution",
              cliVersion: process.env.CLI_RESOLVED,
              from: process.env.FROM_STARTER,
              starter: pkg.clubedge,
              chapters: cast.filter((e) => e[1] === "m").map(([time, , label]) => ({ time, label })),
              duration: cast.at(-1)[0],
              checks: ["pnpm install", "pnpm lint", "pnpm typecheck", "pnpm test", "pnpm build"],
              capturedAt: new Date().toISOString(),
              run: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            };
            fs.writeFileSync(process.argv[2], JSON.stringify(out, null, 2));
          ' "$RUNNER_TEMP/showcase/project-evolution.cast" "$RUNNER_TEMP/showcase/project-evolution.json"
          cat "$RUNNER_TEMP/showcase/project-evolution.json"
      - name: Upload the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-evolution
          path: ${{ runner.temp }}/showcase
          if-no-files-found: ignore
